<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우만뜨락 영상 — 전체 미리보기</title>
<style>
  @font-face{font-family:'Pretendard';font-weight:400;src:url('assets/fonts/Pretendard-Regular.woff2') format('woff2');}
  @font-face{font-family:'Pretendard';font-weight:600;src:url('assets/fonts/Pretendard-SemiBold.woff2') format('woff2');}
  @font-face{font-family:'Pretendard';font-weight:800;src:url('assets/fonts/Pretendard-ExtraBold.woff2') format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Pretendard',sans-serif;background:#11181d;color:#e9eef0;padding:44px 52px 120px;}
  h1{font-size:38px;font-weight:800;letter-spacing:-.03em;}
  .sub{color:#8aa0a6;margin-top:10px;font-size:17px;line-height:1.6;}
  .warn{margin:24px 0 6px;background:#3a2a12;border:1px solid #6b4d1d;color:#f0c98a;padding:16px 20px;border-radius:14px;font-size:15px;font-weight:600;line-height:1.6;}
  h2{font-size:23px;margin:50px 0 18px;font-weight:800;color:#9be9c0;letter-spacing:-.02em;border-left:5px solid #2f9e6b;padding-left:14px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:26px;}
  .card{background:#1a242a;border:1px solid #26343b;border-radius:16px;overflow:hidden;}
  .fb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;}
  .fb.ov{background:linear-gradient(135deg,#5b7d8c,#2f4a39 70%);}
  .fb iframe{position:absolute;top:0;left:0;width:1920px;height:1080px;border:0;transform:scale(.21875);transform-origin:top left;}
  .meta{padding:13px 16px 15px;}
  .meta .t{font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .meta .d{color:#86989e;font-size:13.5px;margin-top:5px;}
  .tags{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .tg{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .tg.cut{background:#243b30;color:#9be9c0;} .tg.v{background:#3a2c47;color:#d6b6f0;} .tg.p{background:#15323a;color:#86d6e0;}
  .tg.ov{background:#3a3320;color:#e6cd8a;}
  a.dl{color:#7fe0ad;text-decoration:none;font-weight:700;font-size:13px;margin-left:auto;}
  .reload{position:fixed;right:24px;bottom:22px;background:#2f9e6b;color:#fff;border:0;padding:13px 20px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
</style></head>
<body>
  <h1>🎬 우만뜨락 영상 — 전체 미리보기 <span style="color:#8aa0a6;font-size:20px">(총 4분 55초)</span></h1>
  <div class="sub">촬영 없이 <b>전 구간 일러스트 애니메이션</b>으로 제작했습니다. 카드는 모두 <b>실시간 재생</b>됩니다.<br>
    🟪 webm 영상 = 타임라인에 그대로 · 🟦 투명 PNG = 촬영컷(여기선 일러스트) 위에 얹는 자막/타이틀.</div>
  <div class="warn">⚠️ 화면의 모든 숫자·이름·인터뷰 발언은 <b>예시 플레이스홀더</b>입니다. <code>scenes/*.html</code>의 <code>CONFIG</code>/<code>QUOTE</code>를 실제 내용으로 교체 후 다시 렌더하세요.</div>

  <div id="root"></div>
  <h2>＋ 투명 PNG 오버레이 (영상 위에 얹기)</h2>
  <div class="grid" id="g-ov"></div>
  <button class="reload" onclick="location.reload()">↻ 전체 다시 재생</button>
<script>
const SECTIONS=[
 ['① 문제 인식 (0:00–0:48)',[
   [1,'0:00','단지 전경 와이드','cut01-skyline','＋위치태그'],
   [2,'0:05','텅 빈 놀이터','cut02-playground'],
   [3,'0:09','걷는 어르신 뒷모습','cut03-elder-walk'],
   [4,'0:13','인포그래픽① 35년 타임라인','01-timeline'],
   [5,'0:24','폐관 어린이집','cut05-daycare'],
   [6,'0:28','인포그래픽② 인구 카운트업','02-population'],
   [7,'0:39','불 꺼진 빈 공간','cut07-closed-door'],
   [8,'0:43','창가의 어르신','cut08-elder-window'],
 ]],
 ['② 변화의 필요성 (0:48–1:18)',[
   [9,'0:48','개선 전 1층 노후 공간','cut09-old-space'],
   [10,'0:53','개선 전 낡은 회의실','cut10-old-meeting'],
   [11,'0:57','돌봄 노동자','cut11-careworker'],
   [12,'1:01','인포그래픽③ 돌봄 종사자','03-careworkers'],
   [13,'1:13','좁은 복도','cut13-corridor'],
 ]],
 ['③ 함께 만든 과정 (1:18–1:48)',[
   [14,'1:18','인포그래픽④ 예산 합쳐짐','04-budget'],
   [15,'1:30','주민 의견수렴','cut15-meeting'],
   [16,'1:34','공사 현장','cut16-construction'],
   [17,'1:38','시공·마감','cut17-finishing'],
   [18,'1:42','완성 공간 리빌','cut18-reveal'],
 ]],
 ['④ 네 개의 공간 (1:48–3:28)',[
   [19,'1:48','어울청 — 와이드','cut19-eoulcheong-wide','＋타이틀'],
   [20,'1:52','어울청 — 고르는 손','cut20-eoulcheong-hands'],
   [22,'2:00','어울청 — 거래·대화','cut22-eoulcheong-people'],
   [25,'2:13','느티나무 — 와이드','cut25-neuti-wide','＋타이틀'],
   [26,'2:17','느티나무 — 차 따르는 손','cut26-neuti-hands'],
   [28,'2:25','느티나무 — 담소','cut28-neuti-people'],
   [31,'2:38','모두의부엌 — 와이드','cut31-kitchen-wide','＋타이틀'],
   [32,'2:42','모두의부엌 — 도마 손','cut32-kitchen-hands'],
   [34,'2:50','모두의부엌 — 식사','cut34-kitchen-people'],
   [37,'3:03','우만꿈터 — 서가 와이드','cut37-kkumteo-wide','＋타이틀'],
   [38,'3:07','우만꿈터 — 책장 넘기는 손','cut38-kkumteo-hands'],
   [41,'3:19','우만꿈터 — 세대','cut41-kkumteo-people'],
 ]],
 ['⑤ 사람의 목소리 — 인터뷰(인용구 카드) (3:28–4:10)',[
   [43,'3:28','인용구 · 주민 ①','cut43-quote-resident1','＋이름자막'],
   [44,'3:33','B컷 · 주민 이용','cut44-broll-resident-use'],
   [45,'3:38','인용구 · 주민 ②','cut45-quote-resident2'],
   [46,'3:44','B컷 · 웃는 표정','cut46-broll-smile'],
   [47,'3:49','인용구 · 요양보호사 ①','cut47-quote-careworker1','＋이름자막'],
   [48,'3:54','B컷 · 로비/홀','cut48-broll-lobby'],
   [49,'3:59','인용구 · 요양보호사 ②','cut49-quote-careworker2'],
   [50,'4:05','B컷 · 쉼터 휴식','cut50-broll-lounge'],
 ]],
 ['⑥ 클로징 (4:10–4:55)',[
   [51,'4:10','Before / After 분할','12-beforeafter'],
   [52,'4:18','After 디테일','cut52-after-detail'],
   [53,'4:22','단체 컷','cut53-group-smile'],
   [54,'4:27','홀 전경','cut54-hall'],
   [55,'4:32','감사 텍스트','14-closing-thanks'],
   [56,'4:40','로고 엔딩','15-closing-logo'],
 ]],
];
const OVER=[
  ['05-title-eoulcheong','어울청 타이틀','컷 19'],['06-title-neuti','느티나무 타이틀','컷 25'],
  ['07-title-kitchen','모두의부엌 타이틀','컷 31'],['08-title-kkumteo','우만꿈터 타이틀','컷 37'],
  ['09-lower-resident','이름자막 · 주민','컷 43'],['10-lower-careworker','이름자막 · 요양보호사','컷 47'],
  ['11-tag-location','위치 태그','컷 1'],
];
const root=document.getElementById('root');
for(const [title,items] of SECTIONS){
  const h=document.createElement('h2');h.textContent=title;root.appendChild(h);
  const g=document.createElement('div');g.className='grid';root.appendChild(g);
  for(const [cut,tc,name,file,ov] of items){
    g.insertAdjacentHTML('beforeend',`<div class="card">
      <div class="fb"><iframe loading="lazy" src="scenes/${file}.html"></iframe></div>
      <div class="meta"><div class="t">${name}</div><div class="d">컷 ${cut} · ${tc}</div>
        <div class="tags"><span class="tg cut">컷 ${cut}</span><span class="tg v">webm</span>
          ${ov?`<span class="tg ov">${ov}</span>`:''}<a class="dl" href="out/${file}.webm">↓</a></div></div></div>`);
  }
}
const go=document.getElementById('g-ov');
for(const [file,name,cut] of OVER){
  go.insertAdjacentHTML('beforeend',`<div class="card">
    <div class="fb ov"><iframe loading="lazy" src="scenes/${file}.html"></iframe></div>
    <div class="meta"><div class="t">${name}</div><div class="d">${cut}</div>
      <div class="tags"><span class="tg p">투명 PNG</span><a class="dl" href="out/${file}.png">↓</a></div></div></div>`);
}
</script>
</body></html>
