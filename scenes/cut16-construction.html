<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷16 공사 현장</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage">
  <div class="cam" id="cam"><svg class="ill" id="art">
    <rect x="-100" y="-100" width="2120" height="900" fill="#d6cdb6"/>
    <rect x="-100" y="720" width="2120" height="440" fill="#bcb094"/>
    <rect x="-100" y="720" width="2120" height="8" fill="#a89a7c"/>
    <!-- 비계(스캐폴딩) -->
    <g stroke="#9aa0a6" stroke-width="12" stroke-linecap="round">
      <line x1="300" y1="180" x2="300" y2="720"/><line x1="560" y1="180" x2="560" y2="720"/>
      <line x1="290" y1="300" x2="570" y2="300"/><line x1="290" y1="470" x2="570" y2="470"/><line x1="290" y1="640" x2="570" y2="640"/>
      <line x1="300" y1="300" x2="560" y2="470"/></g>
    <rect x="280" y="290" width="300" height="16" rx="6" fill="#c59b66"/>
    <!-- 벽(미장 중) -->
    <rect x="680" y="240" width="780" height="480" rx="8" fill="#cabd9e"/>
    <rect x="680" y="240" width="420" height="480" fill="#d8ccae"/>
    <path d="M1100 240 l40 30 -40 30 40 30 -40 30 40 30 -40 30 40 30 -40 30 40 30 -40 30 40 30 -40 30 40 30 -40 30z" fill="#cabd9e"/>
    <!-- 작업자(헬멧) -->
    <g id="worker"></g>
    <!-- 페인트통/도구 -->
    <g transform="translate(1560 640)"><rect x="0" y="0" width="90" height="80" rx="8" fill="#cf6b5a"/><rect x="0" y="0" width="90" height="18" fill="#b8503f"/><rect x="20" y="-30" width="50" height="30" fill="#d8ccae"/></g>
    <rect x="1500" y="560" width="160" height="14" rx="6" fill="#8a8170" transform="rotate(-30 1580 567)"/>
    <!-- 먼지 -->
    <g id="dust" fill="#cabd9e" opacity=".5"></g>
  </svg></div>
  <div class="grain"></div><div class="vig"></div>
</div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
function worker(arm){return ILL.figure({cloth:'#e7a23c',pants:'#54606a',hair:'#3a2e25',armR:arm,armL:10})
  + `<g transform="translate(0 -396)"><path d="M-44 0 a44 30 0 0 1 88 0z" fill="#f2c14e"/><rect x="-50" y="-2" width="100" height="12" rx="6" fill="#d89c2e"/></g>`;}
let d='';for(let i=0;i<14;i++)d+=`<circle cx="${700+i*60}" cy="${400+(i%4)*70}" r="${3+i%3}"/>`;$('dust').innerHTML=d;
Scene.define(4,(t,An)=>{const {lerp,E}=An;const p=t/4;
  $('cam').style.transform=`scale(${lerp(1.0,1.06,E.inOutQuad(p))}) translateX(${lerp(10,-10,p)}px)`;
  const arm=-30+Math.sin(t*5)*26;            // 망치질/미장 동작
  $('worker').innerHTML=ILL.place(960,720,1,worker(arm));
  [...$('dust').children].forEach((c,i)=>{c.setAttribute('cy',400+(i%4)*70+((t*30+i*20)%120)); c.setAttribute('opacity',0.5-((t*30+i*20)%120)/240);});
});
</script></body></html>
