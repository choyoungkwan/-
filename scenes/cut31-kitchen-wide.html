<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷31 모두의부엌 와이드</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm"><div class="cam" id="cam"><svg class="ill" id="art"></svg></div>
  <div class="grain"></div><div class="vig"></div></div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
$('art').innerHTML=`
  <rect x="-100" y="-100" width="2120" height="780" fill="#f1e8d3"/>
  <rect x="-100" y="660" width="2120" height="500" fill="#e3d2ae"/>
  <rect x="-100" y="660" width="2120" height="10" fill="#cfba8f"/>
  <!-- 상부장 -->
  <g fill="#cf8a5e">${[0,1,2,3,4].map(i=>`<rect x="${480+i*200}" y="150" width="180" height="150" rx="8"/>`).join('')}</g>
  <g fill="#b9774c">${[0,1,2,3,4].map(i=>`<rect x="${560+i*200}" y="280" width="20" height="16" rx="4"/>`).join('')}</g>
  <!-- 매달린 조리도구 -->
  <line x1="500" y1="330" x2="1340" y2="330" stroke="#9c7344" stroke-width="6"/>
  <g stroke="#8a8f96" stroke-width="6" fill="#b9bcc0">
    <line x1="620" y1="330" x2="620" y2="400"/><circle cx="620" cy="420" r="22"/>
    <line x1="760" y1="330" x2="760" y2="410"/><rect x="746" y="410" width="28" height="40" rx="6"/>
    <line x1="900" y1="330" x2="900" y2="400"/><path d="M886 400 q14 30 28 0z"/></g>
  <!-- 조리대 -->
  <rect x="440" y="540" width="1040" height="150" rx="10" fill="#c9bda2"/>
  <rect x="440" y="540" width="1040" height="22" rx="8" fill="#dfd4ba"/>
  <!-- 가스레인지/냄비 -->
  <rect x="520" y="500" width="180" height="44" rx="8" fill="#9aa0a6"/><ellipse cx="610" cy="500" rx="56" ry="18" fill="#b9bcc0"/>
  <g id="steam" stroke="#e8e3d2" stroke-width="6" fill="none" stroke-linecap="round" opacity=".5"><path d="M600 470 q-14 -26 0 -50"/><path d="M630 470 q14 -26 0 -50"/></g>
  <!-- 요리하는 사람 -->
  ${ILL.place(1120,690,0.92,ILL.figure({cloth:'#cf6b5a',pants:'#54606a',hair:'#3a2e25',armL:24,armR:-30})+`<rect x="-44" y="-210" width="88" height="120" rx="10" fill="#eef3ee" opacity=".85"/>`)}
  ${ILL.place(220,700,1.3,ILL.plant({s:1}))}`;
Scene.define(8,(t,An)=>{const {lerp,E}=An;const p=t/8;
  $('cam').style.transform=`scale(${lerp(1.06,1.0,p)}) translateX(${lerp(14,-14,p)}px)`;
  const s=document.getElementById('steam');s.setAttribute('opacity',0.4+Math.sin(t*2)*0.2);
  s.setAttribute('transform',`translate(0 ${-(t*8)%30})`);});
</script></body></html>
