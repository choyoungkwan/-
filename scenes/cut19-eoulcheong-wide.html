<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷19 어울청 와이드</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm">
  <div class="cam" id="cam"><svg class="ill" id="art">
    <rect x="-100" y="-100" width="2120" height="820" fill="#f0e7d2"/>
    <rect x="-100" y="700" width="2120" height="460" fill="#dcc9a6"/>
    <rect x="-100" y="700" width="2120" height="8" fill="#c9b48c"/>
    <!-- 선반 + 물건 -->
    <g id="shelves"></g>
    <!-- 매대(나무) -->
    <rect x="560" y="560" width="800" height="180" rx="10" fill="#c59b66"/>
    <rect x="560" y="560" width="800" height="26" rx="10" fill="#d8ac74"/>
    <!-- 진열 상품 -->
    <g id="goods"></g>
    <!-- 가게 사람(앞치마) -->
    <g id="keeper"></g>
    <!-- 작은 매달린 깃발 -->
    <g id="flags"></g>
  </svg></div>
  <div class="grain"></div><div class="vig"></div>
</div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
const pal=['#cf6b5a','#e7a23c','#3f9e72','#4a86ad','#c88a5e','#9c7ab5'];
// 벽 선반 3단
let sh='';for(let r=0;r<3;r++){sh+=`<rect x="600" y="${180+r*120}" width="720" height="14" rx="6" fill="#b78a55"/>`;
  for(let i=0;i<7;i++){const c=pal[(r+i)%pal.length];sh+=`<rect x="${620+i*98}" y="${130+r*120}" width="66" height="48" rx="6" fill="${c}"/>`;}}
$('shelves').innerHTML=sh;
$('goods').innerHTML=[['#cf6b5a',640],['#e7a23c',740],['#3f9e72',840],['#4a86ad',1040],['#c88a5e',1160]]
  .map(([c,x],i)=>`<g transform="translate(${x} 500)"><rect x="0" y="0" width="70" height="60" rx="8" fill="${c}"/><rect x="14" y="-18" width="42" height="22" rx="5" fill="#fff" opacity=".8"/></g>`).join('');
$('keeper').innerHTML=ILL.place(960,560,0.92,ILL.figure({cloth:'#3f9e72',pants:'#6b5d4a',hair:'#4a3a2e',armL:18,armR:-18})
  +`<rect x="-44" y="-210" width="88" height="120" rx="10" fill="#eef3ee" opacity=".85"/>`);
let fl='';for(let i=0;i<8;i++)fl+=`<path d="M${560+i*100} 120 l40 0 -20 36z" fill="${pal[i%pal.length]}"/>`;$('flags').innerHTML=`<line x1="560" y1="120" x2="1360" y2="120" stroke="#b78a55" stroke-width="4"/>`+fl;
Scene.define(8,(t,An)=>{const {lerp,E}=An;const p=t/8;
  $('cam').style.transform=`scale(${lerp(1.0,1.07,E.inOutQuad(p))}) translateX(${lerp(16,-16,p)}px)`;});
</script></body></html>
