<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷10 개선 전 회의실</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage">
  <div class="cam" id="cam"><svg class="ill" id="art">
    <rect x="-100" y="-100" width="2120" height="820" fill="#cdc5b1"/>
    <rect x="-100" y="640" width="2120" height="520" fill="#b8ae93"/>
    <rect x="-100" y="640" width="2120" height="8" fill="#a4987c"/>
    <!-- 화이트보드 -->
    <rect x="640" y="150" width="640" height="300" rx="10" fill="#e8e3d2" stroke="#b6ab90" stroke-width="8"/>
    <path d="M700 250 h220 M700 320 h360 M700 380 h180" stroke="#bcb59f" stroke-width="8" stroke-linecap="round"/>
    <!-- 긴 테이블(원근) -->
    <polygon points="560,760 1360,760 1180,560 740,560" fill="#b78a55"/>
    <polygon points="560,760 1360,760 1340,792 580,792" fill="#9c7344"/>
    <!-- 의자들(짝짝이) -->
    <g id="chairs"></g>
  </svg></div>
  <div class="grain"></div><div class="vig"></div>
</div>
<script src="../assets/anim.js"></script>
<script>
const $=id=>document.getElementById(id);
const chair=(x,y,s,c)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="20" rx="56" ry="12" fill="rgba(60,45,20,.12)"/>
  <rect x="-40" y="-110" width="80" height="60" rx="10" fill="${c}"/><rect x="-40" y="-40" width="80" height="20" rx="8" fill="${c}"/>
  <rect x="-36" y="-20" width="14" height="44" fill="#8a8170"/><rect x="22" y="-20" width="14" height="44" fill="#8a8170"/></g>`;
$('chairs').innerHTML =
  chair(620,650,1,'#9c8f73')+chair(800,660,1.05,'#a86a5a')+chair(1120,660,1.05,'#6f8a9c')+chair(1300,650,1,'#b3a585')
  +chair(720,520,.78,'#8a9c73')+chair(1180,520,.78,'#a89a7d');
Scene.define(4,(t,An)=>{const {lerp,E}=An;const p=t/4;
  $('cam').style.transform=`scale(${lerp(1.0,1.06,E.inOutQuad(p))}) translateX(${lerp(12,-12,p)}px)`;});
</script></body></html>
