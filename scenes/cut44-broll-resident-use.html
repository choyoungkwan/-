<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷44 B컷 주민 이용</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm"><div class="cam" id="cam"><svg class="ill" id="art"></svg></div>
  <div class="grain"></div><div class="vig"></div></div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
const pal=['#cf6b5a','#e7a23c','#3f9e72','#4a86ad','#c88a5e'];
let sh='';for(let r=0;r<3;r++){sh+=`<rect x="560" y="${230+r*130}" width="800" height="14" rx="6" fill="#b78a55"/>`;
  for(let i=0;i<8;i++)sh+=`<rect x="${580+i*96}" y="${178+r*130}" width="60" height="50" rx="6" fill="${pal[(r+i)%5]}"/>`;}
$('art').innerHTML=`<rect x="-100" y="-100" width="2120" height="780" fill="#f0e7d2"/>
  <rect x="-100" y="700" width="2120" height="460" fill="#dcc9a6"/><rect x="-100" y="700" width="2120" height="10" fill="#c9b48c"/>
  ${sh}<g id="p"></g>`;
Scene.define(5,(t,An)=>{const {lerp,E}=An;const p=t/5;
  $('cam').style.transform=`scale(${lerp(1.0,1.06,E.inOutQuad(p))}) translateX(${lerp(8,-8,p)}px)`;
  const reach=-60+Math.sin(t*1.6)*18;
  $('p').innerHTML=ILL.place(960,720,1.05,ILL.figure({cloth:'#4a86ad',pants:'#6b5d4a',hair:'#c3bcae',gray:true,armR:reach,armL:6}));
});
</script></body></html>
