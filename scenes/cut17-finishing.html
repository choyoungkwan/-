<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷17 시공·마감</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm">
  <div class="cam" id="cam"><svg class="ill" id="art">
    <rect x="-100" y="-100" width="2120" height="860" fill="#efe6d0"/>
    <rect x="-100" y="700" width="2120" height="460" fill="#d8cbb0"/>
    <rect x="-100" y="700" width="2120" height="8" fill="#c6b691"/>
    <!-- 새로 칠하는 벽: 칠해진 영역(밝은 그린) / 미칠 영역 -->
    <rect id="painted" x="560" y="160" width="0" height="520" rx="8" fill="#dff0e6"/>
    <rect x="560" y="160" width="800" height="520" rx="8" fill="none" stroke="#cdbf9b" stroke-width="4"/>
    <!-- 작업자 + 롤러 -->
    <g id="worker"></g>
  </svg></div>
  <div class="grain"></div><div class="vig"></div>
</div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
function worker(armA,rollerY){return ILL.figure({cloth:'#4a86ad',pants:'#54606a',hair:'#3a2e25',armR:armA,armL:8})
  + `<g transform="translate(${56} ${-300+ (armA+40)*1.2})"><rect x="0" y="-6" width="14" height="120" rx="6" fill="#8a8170" transform="rotate(20)"/>
       <rect x="22" y="-30" width="70" height="34" rx="8" fill="#cf6b5a"/></g>`;}
Scene.define(4,(t,An)=>{const {lerp,E}=An;const p=t/4;
  $('cam').style.transform=`scale(${lerp(1.04,1.0,p)})`;
  // 롤러 위아래 + 벽 점점 칠해짐
  const stroke=Math.sin(t*3.2);
  const armA=-44+stroke*30;
  $('worker').innerHTML=ILL.place(900,720,1,worker(armA,0));
  $('painted').setAttribute('width', Math.min(800, p*900));
});
</script></body></html>
