<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷48 B컷 로비</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm"><div class="cam" id="cam"><svg class="ill" id="art"></svg></div>
  <div class="grain"></div><div class="vig"></div></div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
$('art').innerHTML=`<rect x="-100" y="-100" width="2120" height="720" fill="#f3ead5"/>
  <rect x="-100" y="640" width="2120" height="520" fill="#e6d6b4"/><rect x="-100" y="640" width="2120" height="10" fill="#d2bd92"/>
  <!-- 큰 창 -->
  ${[300,720,1140,1560].map(x=>ILL.place(x,120,1.0,`<rect x="0" y="0" width="260" height="320" rx="8" fill="#cdbf9b"/><rect x="12" y="12" width="236" height="296" rx="4" fill="#e3f0f6"/><line x1="130" y1="12" x2="130" y2="308" stroke="#cdbf9b" stroke-width="12"/>`)).join('')}
  <!-- 우만뜨락 사인 -->
  <text x="960" y="240" text-anchor="middle" font-family="Pretendard" font-weight="900" font-size="64" fill="#3f9e72">우만<tspan fill="#e7a23c">뜨락</tspan></text>
  <!-- 안내데스크 -->
  <rect x="220" y="560" width="360" height="120" rx="12" fill="#c59b66"/><rect x="220" y="560" width="360" height="20" rx="8" fill="#d8ac74"/>
  ${ILL.place(1740,660,1.3,ILL.plant({s:1}))}
  ${ILL.place(150,660,1.2,ILL.plant({s:1}))}
  <g id="people"></g>`;
function walker(x,y,s,c,h,gray){return ILL.place(x,y,s,ILL.figure({cloth:c,hair:h,gray:gray,pants:'#6b5d4a',armL:14,armR:-14}));}
Scene.define(5,(t,An)=>{const {lerp,E}=An;const p=t/5;
  $('cam').style.transform=`scale(${lerp(1.0,1.05,E.inOutQuad(p))})`;
  const a=( -120 + (t*120)%2160 );
  const b=( 2040 - (t*100)%2160 );
  $('people').innerHTML=walker(a,720,1.0,'#cf6b5a','#4a3a2e')+walker(b,700,0.95,'#4a86ad','#c3bcae',true)+walker(980,740,1.05,'#3f9e72','#544234');
});
</script></body></html>
