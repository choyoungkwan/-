<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>컷52 After 디테일</title>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/illus.css"></head>
<body><div class="stage warm"><div class="cam" id="cam"><svg class="ill" id="art"></svg></div>
  <div class="grain"></div><div class="vig"></div></div>
<script src="../assets/anim.js"></script><script src="../assets/illus.js"></script>
<script>
const ILL=window.ILL,$=id=>document.getElementById(id);
$('art').innerHTML=`<rect x="-100" y="-100" width="2120" height="760" fill="#f6eeda"/>
  <rect x="-100" y="660" width="2120" height="500" fill="#e8d6b2"/><rect x="-100" y="660" width="2120" height="10" fill="#d4c094"/>
  ${ILL.place(1180,120,1.7,`<rect x="0" y="0" width="300" height="360" rx="8" fill="#cdbf9b"/><rect x="14" y="14" width="272" height="332" rx="4" fill="#eaf4f8"/><rect x="14" y="14" width="272" height="200" fill="#dcecf4"/><line x1="150" y1="14" x2="150" y2="346" stroke="#cdbf9b" stroke-width="14"/><line x1="14" y1="180" x2="286" y2="180" stroke="#cdbf9b" stroke-width="14"/>`)}
  <polygon id="ray" points="1200,200 1560,200 1820,720 980,720" fill="#fdeec4" opacity="0"/>
  <!-- 의자 + 화분 -->
  <g transform="translate(560 470)"><rect x="0" y="120" width="180" height="200" rx="16" fill="#cf8a5e"/><rect x="-16" y="-20" width="40" height="320" rx="18" fill="#c47e50"/><rect x="0" y="-20" width="180" height="150" rx="16" fill="#dba074"/></g>
  ${ILL.place(960,720,1.5,ILL.plant({s:1}))}`;
Scene.define(4,(t,An)=>{const {lerp,E,span}=An;const p=t/4;
  $('cam').style.transform=`scale(${lerp(1.05,1.0,p)}) translateX(${lerp(10,-10,p)}px)`;
  $('ray').style.opacity=span(t,.4,2.0,E.outCubic)*0.8;});
</script></body></html>
