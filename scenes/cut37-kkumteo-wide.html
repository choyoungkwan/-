<body><div class="stage warm"><div class="cam" id="cam"><svg class="ill" id="art"></svg></div>

<script>
const ILL=window.ILL,$=id=>document.getElementById(id);

  <ellipse cx="960" cy="860" rx="420" ry="80" fill="#dcae8f" opacity=".5"/>
  <ellipse cx="960" cy="780" rx="220" ry="48" fill="#b78a55"/><ellipse cx="960" cy="766" rx="220" ry="44" fill="#c59b66"/>

Scene.define(8,(t,An)=>{const {lerp,E}=An;const p=t/8;
  $('cam').style.transform=`scale(${lerp(1.0,1.07,E.inOutQuad(p))}) translateX(${lerp(-14,14,p)}px)`;});
